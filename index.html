<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Копилка</title>
<meta name="description" content="Учёт карманных денег и цели накоплений: доходы, расходы, график трат по категориям. Бесплатно, данные остаются у тебя.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23e8b923'/><circle cx='32' cy='32' r='20' fill='none' stroke='%23a07a06' stroke-width='3'/><text x='32' y='42' font-size='26' text-anchor='middle' font-family='Arial' font-weight='bold' fill='%23a07a06'>₴</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: сверху «чек» с балансом, ниже две колонки — операции и аналитика/цели. Палитра: тёмно-зелёный «банкнотный» + золото монеты. */
:root {
  --bg: #eef3ee; --surface: #ffffff; --surface2: #f5f8f4; --ink: #102418; --soft: #5d7465; --line: #d6e2d8;
  --money: #0d6b3c; --gold: #e2b31d; --in: #138a4b; --out: #c2412d;
  --display: "Unbounded", "Arial Black", sans-serif; --body: "Onest", system-ui, sans-serif; --mono: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1611; --surface: #13211a; --surface2: #0f1b15; --ink: #e6f2ea; --soft: #8fa898; --line: #22382c;
  --money: #3fcf86; --gold: #f2c94c; --in: #4ade80; --out: #ff7a66; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0c1611; --surface: #13211a; --surface2: #0f1b15; --ink: #e6f2ea; --soft: #8fa898; --line: #22382c;
  --money: #3fcf86; --gold: #f2c94c; --in: #4ade80; --out: #ff7a66; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
header { display: flex; align-items: center; gap: 12px; padding-block: 16px; flex-wrap: wrap; }
.logo { font: 700 22px var(--display); display: flex; align-items: center; gap: 10px; }
.coin { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe48a, var(--gold) 60%, #a07a06); display: grid; place-items: center; color: #6b5203; font: 700 16px var(--display); box-shadow: inset 0 0 0 3px rgba(255,255,255,.35); }
header .sp { flex: 1; }
select, input[type=text], input[type=number], input[type=date] { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.ib { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; height: 42px; min-width: 42px; padding: 0 12px; cursor: pointer; }
.btn { border: 0; background: var(--money); color: #fff; border-radius: 10px; padding: 11px 18px; font-weight: 700; cursor: pointer; }
:root[data-theme="dark"] .btn:not(.ghost) { color: #062414; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn:not(.ghost) { color: #062414; } }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:focus-visible, .ib:focus-visible, .chip:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
/* чек */
.receipt { background: var(--surface); border-radius: 4px; padding: 26px 26px 30px; position: relative; display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 20px; align-items: end;
  -webkit-mask: radial-gradient(circle 7px at 50% 100%, transparent 98%, #000) 0 0/18px 100% repeat-x; mask: radial-gradient(circle 7px at 50% 100%, transparent 98%, #000) 0 0/18px 100% repeat-x; }
.lbl { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); font-weight: 700; }
.balance { font: 700 clamp(34px, 6vw, 56px)/1 var(--display); color: var(--money); font-variant-numeric: tabular-nums; margin-top: 6px; overflow-wrap: anywhere; }
.sum { font: 500 22px var(--mono); margin-top: 6px; font-variant-numeric: tabular-nums; }
.in { color: var(--in); } .out { color: var(--out); }
.example { margin: 12px 0 0; padding: 10px 14px; border: 1px dashed var(--gold); border-radius: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; margin: 22px 0 50px; }
.grid > * { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
.card h2 { font: 700 17px var(--display); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
.card h2 .sp { flex: 1; }
.seg { display: inline-flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { font: 700 14px var(--body); border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; color: var(--soft); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg button.on[data-t="out"] { color: var(--out); } .seg button.on[data-t="in"] { color: var(--in); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.form .full { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.ops { list-style: none; padding: 0; margin: 0; }
.ops li { display: grid; grid-template-columns: 38px 1fr auto auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.ops li:last-child { border-bottom: 0; }
.ops .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--surface2); font-size: 18px; }
.ops .t { min-width: 0; } .ops .t b { display: block; overflow-wrap: anywhere; } .ops .t small { color: var(--soft); }
.ops .amt { font: 500 16px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.x { border: 0; background: transparent; color: var(--soft); cursor: pointer; font-size: 18px; }
.x:hover { color: var(--out); }
.empty { color: var(--soft); text-align: center; padding: 24px 0; }
.donut { display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: center; }
.donut svg { width: 170px; height: 170px; max-width: 100%; }
.legend { list-style: none; padding: 0; margin: 0; font-size: 14px; }
.legend li { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend span { flex: 1; } .legend b { font: 500 14px var(--mono); }
.goal { padding: 14px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; background: var(--surface2); }
.goal .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.goal .name { font-weight: 700; flex: 1; min-width: 120px; }
.meter { height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 10px 0 6px; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--money), var(--gold)); }
.goal small { color: var(--soft); }
.goal input { width: 110px; }
.calc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.calc .res { grid-column: 1 / -1; background: var(--surface2); border-radius: 10px; padding: 12px; font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-weight: 700; opacity: 0; transition: .2s; pointer-events: none; }
.toast.show { opacity: 1; }
footer { color: var(--soft); font-size: 13px; padding-bottom: 30px; text-align: center; }
footer a { color: var(--soft); }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; } .receipt { grid-template-columns: 1fr 1fr; } .receipt > :first-child { grid-column: 1 / -1; } }
@media (max-width: 460px) { .donut { grid-template-columns: 1fr; justify-items: center; } .form { grid-template-columns: 1fr; } .ops li { grid-template-columns: 34px 1fr auto; } .ops .x { grid-column: 3; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="coin">₴</span>Копилка</div>
    <span class="sp"></span>
    <button class="ib" id="prev" aria-label="Предыдущий месяц">‹</button><b id="month" style="min-width:130px;text-align:center"></b><button class="ib" id="next" aria-label="Следующий месяц">›</button>
    <select id="cur" aria-label="Валюта"><option value="₴">₴ гривна</option><option value="$">$ доллар</option><option value="€">€ евро</option><option value="zł">zł злотый</option></select>
    <button class="ib" id="theme" aria-label="Сменить тему" title="Сменить тему">◐</button>
  </header>

  <section class="receipt">
    <div><div class="lbl">Сейчас у тебя</div><div class="balance" id="bal">0</div></div>
    <div><div class="lbl">Пришло за месяц</div><div class="sum in" id="mIn">0</div></div>
    <div><div class="lbl">Потрачено за месяц</div><div class="sum out" id="mOut">0</div></div>
  </section>
  <div class="example" id="exNote" hidden>Это пример, чтобы было видно, как всё работает. <button class="btn ghost" id="clearEx">Убрать пример и начать с нуля</button></div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>Новая запись<span class="sp"></span><span class="seg"><button data-t="out" class="on">Расход</button><button data-t="in">Доход</button></span></h2>
        <div class="chips" id="cats"></div>
        <div class="form">
          <input type="number" id="amt" min="0" step="0.01" placeholder="Сумма" inputmode="decimal">
          <input type="date" id="date">
          <input type="text" id="note" class="full" placeholder="Комментарий (необязательно)">
          <button class="btn full" id="add">Добавить</button>
        </div>
      </div>
      <div class="card"><h2>Записи за месяц<span class="sp"></span><button class="btn ghost" id="csv" style="padding:6px 12px;font-size:14px">⬇ CSV</button></h2><ul class="ops" id="ops"></ul></div>
    </div>
    <div>
      <div class="card"><h2>Куда уходят деньги</h2><div id="chart"></div></div>
      <div class="card"><h2>Цели<span class="sp"></span></h2>
        <div id="goals"></div>
        <div class="form"><input type="text" id="gName" placeholder="На что копим? Например: наушники"><input type="number" id="gSum" placeholder="Сколько нужно" min="1"><button class="btn ghost full" id="gAdd">+ Добавить цель</button></div>
      </div>
      <div class="card"><h2>Сколько копить?</h2>
        <div class="calc"><input type="number" id="cT" placeholder="Цена" min="1" value="2500"><input type="number" id="cW" placeholder="Откладываю в неделю" min="1" value="200"><div class="res" id="cRes"></div></div>
      </div>
    </div>
  </div>
  <footer>Копилка — данные хранятся только в твоём браузере · <a href="https://strimsnaener-cpu.github.io/utilka/">Утилька</a> · <a href="https://strimsnaener-cpu.github.io/zubrilka/">Зубрилка</a> · <a href="https://strimsnaener-cpu.github.io/orbita/">Орбита</a></footer>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const load = (k, d) => { try { const v = localStorage.getItem("kop:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem("kop:" + k, JSON.stringify(v)); } catch (e) {} };
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800); };
const CATS = {
  out: [["food", "🍔", "Еда", "#e07a2f"], ["games", "🎮", "Игры", "#7c5cff"], ["fun", "🎬", "Развлечения", "#e0457b"], ["clothes", "👕", "Одежда", "#2f8fe0"], ["transport", "🚌", "Транспорт", "#14a3a3"], ["study", "📚", "Учёба", "#8a6d3b"], ["gifts", "🎁", "Подарки", "#d4a017"], ["save", "🐷", "В копилку", "#0d6b3c"], ["other", "📦", "Другое", "#7d8a82"]],
  in: [["pocket", "💵", "Карманные", "#138a4b"], ["gift", "🎁", "Подарили", "#d4a017"], ["job", "🛠", "Подработка", "#2f8fe0"], ["sell", "🏷", "Продал", "#7c5cff"], ["other", "📦", "Другое", "#7d8a82"]],
};
const cat = (t, id) => CATS[t].find((c) => c[0] === id) || CATS[t][CATS[t].length - 1];
const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const today = new Date();
function sample() {
  const d = (n) => iso(new Date(today.getFullYear(), today.getMonth(), Math.max(1, Math.min(today.getDate(), n))));
  return [
    { t: "in", c: "pocket", a: 1000, d: d(1), n: "Карманные на месяц" }, { t: "out", c: "food", a: 85, d: d(2), n: "Шаурма с друзьями" },
    { t: "out", c: "games", a: 299, d: d(3), n: "Боевой пропуск" }, { t: "out", c: "transport", a: 60, d: d(4), n: "Проезд" },
    { t: "in", c: "gift", a: 500, d: d(5), n: "От бабушки" }, { t: "out", c: "save", a: 300, d: d(6), n: "Наушники" },
    { t: "out", c: "fun", a: 180, d: d(7), n: "Кино" }, { t: "out", c: "food", a: 120, d: d(8), n: "Перекусы в школе" },
  ].map((o, i) => ({ ...o, id: "ex" + i, ex: true }));
}
let ops = load("ops", null), goals = load("goals", null);
if (!ops) { ops = sample(); goals = [{ id: "g1", n: "Беспроводные наушники", t: 2500, s: 300, ex: true }]; }
goals = goals || [];
let type = "out", pick = "food", view = new Date(today.getFullYear(), today.getMonth(), 1), curr = load("cur", "₴");
$("#cur").value = curr;
const money = (n, sign) => (sign && n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toLocaleString("ru-RU", { maximumFractionDigits: 2 }) + " " + curr;
const persist = () => { save("ops", ops); save("goals", goals); };
const inMonth = (o) => { const d = new Date(o.d); return d.getFullYear() === view.getFullYear() && d.getMonth() === view.getMonth(); };

function renderCats() {
  if (!CATS[type].some((c) => c[0] === pick)) pick = CATS[type][0][0];
  $("#cats").innerHTML = CATS[type].map(([id, ic, name]) => `<button class="chip ${id === pick ? "on" : ""}" data-c="${id}">${ic} ${name}</button>`).join("");
}
function render() {
  const bal = ops.reduce((s, o) => s + (o.t === "in" ? o.a : -o.a), 0), m = ops.filter(inMonth);
  const mi = m.filter((o) => o.t === "in").reduce((s, o) => s + o.a, 0), mo = m.filter((o) => o.t === "out").reduce((s, o) => s + o.a, 0);
  $("#bal").textContent = money(bal); $("#mIn").textContent = money(mi); $("#mOut").textContent = money(mo);
  $("#month").textContent = view.toLocaleDateString("ru-RU", { month: "long", year: "numeric" }).replace(" г.", "");
  $("#exNote").hidden = !ops.some((o) => o.ex) && !goals.some((g) => g.ex);
  const sorted = m.slice().sort((a, b) => b.d.localeCompare(a.d));
  $("#ops").innerHTML = sorted.length ? sorted.map((o) => { const c = cat(o.t, o.c);
    return `<li><span class="ic">${c[1]}</span><span class="t"><b>${esc(o.n || c[2])}</b><small>${c[2]} · ${new Date(o.d).toLocaleDateString("ru-RU", { day: "numeric", month: "short" })}</small></span><span class="amt ${o.t}">${money(o.t === "in" ? o.a : -o.a, true)}</span><button class="x" data-id="${o.id}" aria-label="Удалить">×</button></li>`; }).join("")
    : `<li class="empty" style="display:block">В этом месяце записей нет.</li>`;
  // круговая диаграмма
  const by = {}; m.filter((o) => o.t === "out").forEach((o) => by[o.c] = (by[o.c] || 0) + o.a);
  const parts = Object.entries(by).sort((a, b) => b[1] - a[1]);
  if (!parts.length) $("#chart").innerHTML = `<p class="empty">Трат в этом месяце пока нет.</p>`;
  else {
    const R = 60, C = 2 * Math.PI * R; let off = 0;
    const arcs = parts.map(([id, v]) => { const len = v / mo * C, c = cat("out", id); const s = `<circle r="${R}" cx="85" cy="85" fill="none" stroke="${c[3]}" stroke-width="26" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)"/>`; off += len; return s; }).join("");
    $("#chart").innerHTML = `<div class="donut"><svg viewBox="0 0 170 170" role="img" aria-label="Траты по категориям">${arcs}<text x="85" y="80" text-anchor="middle" fill="var(--soft)" font-size="11">потрачено</text><text x="85" y="100" text-anchor="middle" fill="var(--ink)" font-size="15" font-weight="700">${esc(money(mo))}</text></svg>
      <ul class="legend">${parts.map(([id, v]) => { const c = cat("out", id); return `<li><i style="background:${c[3]}"></i><span>${c[1]} ${c[2]}</span><b>${Math.round(v / mo * 100)}%</b></li>`; }).join("")}</ul></div>`;
  }
  // цели
  const weekly = weeklySaving();
  $("#goals").innerHTML = goals.length ? goals.map((g) => { const p = Math.min(100, g.s / g.t * 100), left = Math.max(0, g.t - g.s);
    const eta = left && weekly ? ` · при твоём темпе ещё ~${Math.ceil(left / weekly)} нед.` : "";
    return `<div class="goal"><div class="row"><span class="name">${p >= 100 ? "✅ " : "🎯 "}${esc(g.n)}</span><button class="x" data-g="${g.id}" aria-label="Удалить цель">×</button></div>
      <div class="meter"><i style="width:${p}%"></i></div><small>${money(g.s)} из ${money(g.t)} (${Math.round(p)}%)${left ? ` · осталось ${money(left)}${eta}` : " · цель достигнута!"}</small>
      <div class="row" style="margin-top:8px"><input type="number" min="1" placeholder="Сумма" data-in="${g.id}" aria-label="Сумма"><button class="btn ghost" data-put="${g.id}" style="padding:8px 12px">Отложить</button></div></div>`; }).join("")
    : `<p class="empty">Добавь цель, например «Новый телефон», и откладывай на неё.</p>`;
  calc();
}
function weeklySaving() {
  const since = Date.now() - 28 * 86400000;
  return ops.filter((o) => o.c === "save" && new Date(o.d).getTime() >= since).reduce((s, o) => s + o.a, 0) / 4;
}
function calc() {
  const t = +$("#cT").value, w = +$("#cW").value;
  if (!(t > 0 && w > 0)) { $("#cRes").textContent = "Введи цену и сколько откладываешь в неделю"; return; }
  const weeks = Math.ceil(t / w), date = new Date(Date.now() + weeks * 7 * 86400000);
  $("#cRes").textContent = `${weeks} нед. — накопишь к ${date.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" })}`;
}

document.querySelectorAll(".seg button").forEach((b) => b.onclick = () => { type = b.dataset.t; document.querySelectorAll(".seg button").forEach((x) => x.classList.toggle("on", x === b)); renderCats(); });
$("#cats").onclick = (e) => { const c = e.target.closest(".chip"); if (!c) return; pick = c.dataset.c; renderCats(); };
$("#date").value = iso(today);
$("#add").onclick = () => {
  const a = Math.round(parseFloat($("#amt").value) * 100) / 100;
  if (!(a > 0)) { toast("Введи сумму больше нуля"); $("#amt").focus(); return; }
  const o = { id: Date.now().toString(36), t: type, c: pick, a, d: $("#date").value || iso(today), n: $("#note").value.trim() };
  ops.push(o); persist(); $("#amt").value = ""; $("#note").value = "";
  const d = new Date(o.d); view = new Date(d.getFullYear(), d.getMonth(), 1); render(); toast(type === "in" ? "Доход записан 💵" : "Расход записан");
};
$("#amt").onkeydown = $("#note").onkeydown = (e) => { if (e.key === "Enter") $("#add").click(); };
$("#ops").onclick = (e) => { const b = e.target.closest("[data-id]"); if (!b) return; ops = ops.filter((o) => o.id !== b.dataset.id); persist(); render(); };
$("#goals").onclick = (e) => {
  const del = e.target.closest("[data-g]"); if (del) { goals = goals.filter((g) => g.id !== del.dataset.g); persist(); render(); return; }
  const put = e.target.closest("[data-put]"); if (!put) return;
  const g = goals.find((x) => x.id === put.dataset.put), inp = document.querySelector(`[data-in="${g.id}"]`), a = parseFloat(inp.value);
  if (!(a > 0)) { toast("Введи сумму"); inp.focus(); return; }
  g.s += a; ops.push({ id: Date.now().toString(36), t: "out", c: "save", a, d: iso(new Date()), n: g.n }); persist(); render();
  toast(g.s >= g.t ? "🎉 Цель достигнута!" : "Отложено в «" + g.n + "»");
};
$("#gAdd").onclick = () => { const n = $("#gName").value.trim(), t = parseFloat($("#gSum").value); if (!n || !(t > 0)) { toast("Напиши цель и сумму"); return; } goals.push({ id: Date.now().toString(36), n, t, s: 0 }); persist(); $("#gName").value = $("#gSum").value = ""; render(); };
$("#clearEx").onclick = () => { ops = ops.filter((o) => !o.ex); goals = goals.filter((g) => !g.ex); persist(); render(); toast("Пример убран — начинай!"); };
$("#prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); };
$("#next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); };
$("#cur").onchange = (e) => { curr = e.target.value; save("cur", curr); render(); };
$("#cT").oninput = $("#cW").oninput = calc;
$("#csv").onclick = () => {
  const rows = [["Дата", "Тип", "Категория", "Сумма", "Комментарий"]].concat(ops.slice().sort((a, b) => a.d.localeCompare(b.d)).map((o) => [o.d, o.t === "in" ? "Доход" : "Расход", cat(o.t, o.c)[2], o.a, o.n || ""]));
  const csv = "﻿" + rows.map((r) => r.map((x) => `"${String(x).replace(/"/g, '""')}"`).join(";")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "kopilka.csv"; a.click();
};
const root = document.documentElement;
try { const t = localStorage.getItem("kop:theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("#theme").onclick = () => { const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; root.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("kop:theme", root.dataset.theme); } catch (e) {} };
renderCats(); render();
})();
</script>
